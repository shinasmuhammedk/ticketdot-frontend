name: Frontend CI

on:
  push:
    branches: [ main, master, 'chore/**', 'fix/**', 'feat/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint

      - name: Run Vite build
        run: npm run build

  e2e:
    name: End-to-End Smoke Tests (Playwright)
    runs-on: ubuntu-latest
    needs: lint-and-build

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: busticket_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout frontend repository
        uses: actions/checkout@v4
        with:
          path: ticketdot-frontend

      - name: Checkout backend repository (matching branch)
        id: checkout-backend
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: shinasmuhammedk/ticketdot
          path: TicketDot
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Fallback checkout backend default branch
        if: steps.checkout-backend.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          repository: shinasmuhammedk/ticketdot
          path: TicketDot

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: TicketDot/go.sum

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ticketdot-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ticketdot-frontend
        run: npm ci --legacy-peer-deps

      - name: Install Playwright Chromium & system dependencies
        working-directory: ticketdot-frontend
        run: npx playwright install --with-deps chromium

      - name: Run database migrations & seed test data
        working-directory: ticketdot-frontend
        env:
          DATABASE_URL: "postgres://postgres:postgres@localhost:5432/busticket_test?sslmode=disable"
          BACKEND_DIR: "../TicketDot"
        run: node e2e/seed.js

      - name: Run Playwright E2E tests against running stack
        working-directory: ticketdot-frontend
        env:
          CI: true
          DATABASE_URL: "postgres://postgres:postgres@localhost:5432/busticket_test?sslmode=disable"
          BACKEND_DIR: "../TicketDot"
        run: npm run test:e2e

      - name: Upload Playwright HTML report on test failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: ticketdot-frontend/playwright-report/
          retention-days: 7
